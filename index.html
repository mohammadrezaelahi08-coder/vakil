<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامانه نوبت‌دهی - دفتر وکالت محمد الهی</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; }
body { background-color: #f4f7f6; color: #333; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.container { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 450px; }
h2 { text-align: center; color: #1e3d59; margin-bottom: 5px; font-size: 20px; }
.subtitle { text-align: center; color: #555; font-size: 13px; margin-bottom: 20px; line-height: 1.6; }
.form-group { margin-bottom: 15px; }
label { display: block; margin-bottom: 6px; font-weight: bold; color: #333; font-size: 14px; }
input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; background: #fafafa; }
input:focus, select:focus { border-color: #1e3d59; outline: none; background: #fff; }
button { width: 100%; background-color: #1e3d59; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
button:hover { background-color: #172b3a; }
.info-box { background: #e8f4f8; padding: 10px; border-radius: 6px; font-size: 12px; color: #1e3d59; margin-bottom: 15px; text-align: center; }
</style>
</head>
<body>

<div class="container">
<h2>دفتر وکالت محمد الهی</h2>
<p class="subtitle">رزرو نوبت مشاوره حقوقی<br><strong>روزهای زوج (شنبه، دوشنبه، چهارشنبه)</strong></p>

<div class="info-box">تاریخ‌ها به صورت خودکار روزهای زوجِ پیش‌رو را نشان می‌دهند.</div>

<form action="https://formspree.io/f/xblyqjby" method="POST">

<div class="form-group">
<label for="name">نام و نام خانوادگی:</label>
<input type="text" id="name" name="name" required placeholder="مثلاً: علی رضایی">
</div>

<div class="form-group">
<label for="phone">شماره تماس (جهت هماهنگی):</label>
<input type="tel" id="phone" name="phone" required placeholder="09123456789" pattern="09[0-9]{9}">
</div>

<div class="form-group">
<label for="date">انتخاب روز و تاریخ:</label>
<select id="date" name="date" required>
<option value="">-- در حال بارگذاری تاریخ‌های آزاد --</option>
</select>
</div>

<div class="form-group">
<label for="time">انتخاب ساعت:</label>
<select id="time" name="time" required>
<option value="">-- ابتدا تاریخ را انتخاب کنید --</option>
<option value="16:00 - 17:00">عصر ۱۶:۰۰ الی ۱۷:۰۰</option>
<option value="17:00 - 18:00">عصر ۱۷:۰۰ الی ۱۸:۰۰</option>
<option value="18:00 - 19:00">عصر ۱۸:۰۰ الی ۱۹:۰۰</option>
</select>
</div>

<button type="submit">ثبت نوبت مشاوره</button>
</form>
</div>

<script>
const selectDate = document.getElementById('date');
const daysOfWeek = {
0: 'یکشنبه',
1: 'دوشنبه',
2: 'سه‌شنبه',
3: 'چهارشنبه',
4: 'پنج‌شنبه',
5: 'جمعه',
6: 'شنبه'
};

const persianMonths = ["فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور", "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"];

function getPersianDate(date) {
let options = { year: 'numeric', month: '2-digit', day: '2-digit', calendar: 'persian' };
let parts = new Intl.DateTimeFormat('fa-IR', options).formatToParts(date);
let pYear = parts.find(p => p.type === 'year').value;
let pMonthVal = parseInt(parts.find(p => p.type === 'month').value);
let pDay = parts.find(p => p.type === 'day').value;
return ${pDay} ${persianMonths[pMonthVal - 1]} ${pYear}`;
}

let today = new Date();
selectDate.innerHTML = '<option value="">-- انتخاب تاریخ مشاوره --</option>';

let addedCount = 0;
for (let i = 1; i <= 21; i++) {
let nextDate = new Date();
nextDate.setDate(today.getDate() + i);
let dayNum = nextDate.getDay();

if (dayNum === 6 || dayNum === 1 || dayNum === 3) {
let dayName = daysOfWeek[dayNum];
let formattedDate = getPersianDate(nextDate);
let optionValue = ``${dayName} ${formattedDate};

let opt = document.createElement('option');
opt.value = optionValue;
opt.textContent = ``${dayName} - ${formattedDate}`;
selectDate.appendChild(opt);

addedCount++;
if (addedCount >= 10) break;
}
}
</script>

</body>
</html>
